
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ふりこ10秒チャレンジ</title>

<style>
:root {
  font-family: -apple-system, BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN", sans-serif;
  color: #172338;
  background: #f2f6fb;
}
* { box-sizing: border-box; }
body { margin: 0; }
main {
  max-width: 800px;
  margin: auto;
  padding: 20px 16px 70px;
}
h1 { font-size: 1.6rem; }
h2 { font-size: 1.2rem; }

.card {
  background: white;
  border: 1px solid #dce5f0;
  border-radius: 18px;
  padding: 20px;
  margin: 16px 0;
  box-shadow: 0 3px 15px #15253b0b;
}
.muted { color: #617085; }
.hidden { display: none !important; }
.center { text-align: center; }
.small { font-size: .85rem; }

input, button {
  font: inherit;
  border-radius: 12px;
  padding: 13px;
}
input {
  border: 1px solid #aebdd0;
  width: 100%;
  margin: 7px 0 12px;
}
button {
  border: 0;
  background: #1769ce;
  color: white;
  font-weight: 700;
  cursor: pointer;
}
button:disabled {
  opacity: .45;
  cursor: default;
}
.big {
  font-size: 1.6rem;
  padding: 25px;
  width: 100%;
}
.stop {
  background: #d53f32;
  min-height: 190px;
  font-size: 2.3rem;
  width: 100%;
}
.secondary {
  background: #e7edf5;
  color: #203650;
}
.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.row > * { flex: 1; }

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.top button { padding: 9px 12px; }

.code {
  font-size: 2rem;
  letter-spacing: .14em;
  font-weight: 800;
}
.status {
  font-weight: 700;
  font-size: 1.1rem;
}
.notice {
  background: #fff8e8;
  border-radius: 12px;
  padding: 12px;
  color: #664b16;
}
table {
  width: 100%;
  border-collapse: collapse;
}
th, td {
  padding: 10px 6px;
  text-align: left;
  border-bottom: 1px solid #e4eaf2;
}
th {
  font-size: .85rem;
  color: #5c6a7b;
}
#error {
  color: #a12222;
  white-space: pre-wrap;
}

/* カウントダウン */
.countdown {
  font-size: clamp(4rem, 18vw, 8rem);
  font-weight: 900;
  text-align: center;
  color: #1769ce;
  line-height: 1.2;
  padding: 15px 0;
}
.countdown.go {
  font-size: clamp(2.5rem, 10vw, 5rem);
  color: #15945b;
}
.countLabel {
  text-align: center;
  font-size: 1.2rem;
  font-weight: bold;
}
#studentStatus {
  font-size: 1.5rem;
  font-weight: 800;
}
</style>
</head>

<body>
<main>

<div class="top">
  <h1>⏱ ふりこ10秒チャレンジ</h1>
  <button class="secondary" id="homeBtn">最初へ</button>
</div>

<p class="muted">
時間を見ずに、ふりこの10往復で10秒を測ろう！
</p>

<p id="error" role="alert"></p>

<section id="home" class="card">
  <h2>参加方法を選んでください</h2>
  <div class="row">
    <button id="teacherOpen">先生用</button>
    <button id="studentOpen">児童用</button>
  </div>
</section>

<section id="teacherSetup" class="card hidden">
  <h2>先生：ルーム作成</h2>
  <p class="muted">6桁の参加コードを作成します。</p>
  <button id="createRoom" class="big">
    ルームを作る
  </button>
</section>

<section id="studentSetup" class="card hidden">
  <h2>児童：参加</h2>
  <label>
    参加コード（6桁）
    <input id="roomInput" inputmode="numeric"
      maxlength="6" placeholder="123456">
  </label>
  <label>
    出席番号または名前
    <input id="nameInput" maxlength="24"
      placeholder="例：12番">
  </label>
  <button id="joinRoom" class="big">参加する</button>
</section>

<!-- 教師画面 -->
<section id="teacher" class="hidden">

<div class="card">
  <h2>先生用コントロール</h2>

  <p>参加コード：
    <span id="roomCode" class="code"></span>
  </p>

  <p>
    参加人数：<b id="joinedCount">0</b> 人
    ／ 停止済み：<b id="stoppedCount">0</b> 人
  </p>

  <div id="teacherCountdown" class="hidden">
    <div class="countLabel">スタートまで</div>
    <div id="teacherCount" class="countdown">5</div>
  </div>

  <p class="status center" id="teacherStatus">
    待機中
  </p>

  <button id="startRound" class="big">
    全員スタート（5秒後）
  </button>

  <div class="row" style="margin-top:10px">
    <button class="secondary" id="newRound">
      次のチャレンジへ
    </button>
    <button class="secondary" id="csv">
      結果をCSV保存
    </button>
  </div>

  <p class="notice small">
    スタートを押すと5秒のカウントダウンが始まります。
    児童には測定時間を表示しません。
  </p>
</div>

<div class="card">
  <h2>結果一覧</h2>
  <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>名前</th>
          <th>状態</th>
          <th>測定時間</th>
          <th>10秒との差</th>
        </tr>
      </thead>
      <tbody id="results"></tbody>
    </table>
  </div>
</div>

</section>

<!-- 児童画面 -->
<section id="student" class="hidden">
<div class="card center">

  <p class="muted">
    参加者：<b id="studentName"></b>
  </p>

  <h2 id="studentStatus">
    先生のスタートを待っています
  </h2>

  <div id="studentCountdown" class="hidden">
    <div class="countLabel">スタートまで</div>
    <div id="studentCount" class="countdown">5</div>
  </div>

  <p id="studentHint" class="muted">
    ふりこを準備しましょう
  </p>

  <button id="stopBtn" class="stop hidden" disabled>
    ストップ！
  </button>

  <p id="stopMessage" class="status"></p>

</div>
</section>

<p class="muted small">
測定には通信状況による誤差が生じる場合があります。
</p>

</main>

<script type="module">

import { initializeApp } from
'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';

import { getAuth, signInAnonymously } from
'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';

import {
  getDatabase, ref, get, set, update,
  onValue, push, serverTimestamp
} from
'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';

/* Firebase接続設定 */
const firebaseConfig = {
  apiKey: "AIzaSyCGg-myM7D6hUywA8LZeU2OopOTeD4HltU",
  authDomain: "second-48a13.firebaseapp.com",
  databaseURL: "https://second-48a13-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "second-48a13",
  storageBucket: "second-48a13.firebasestorage.app",
  messagingSenderId: "602369180814",
  appId: "1:602369180814:web:c098b1e368c264526b35df"
};

const $ = id => document.getElementById(id);

const views = [
  'home','teacherSetup','studentSetup',
  'teacher','student'
];

let app, auth, db, uid;
let roomId, role, roomData;
let offset = 0;
let unsub = null;
let roundId = null;
let stopped = false;
let starting = false;

const serverNow = () => Date.now() + offset;

const show = id => {
  views.forEach(x =>
    $(x).classList.toggle('hidden', x !== id)
  );
};

const fail = e => {
  console.error(e);
  $('error').textContent =
    'エラー：' + (e?.message || e);
};

const clearError = () => {
  $('error').textContent = '';
};

const randCode = () =>
  String(Math.floor(100000 + Math.random() * 900000));

function listenRoom() {
  if (unsub) unsub();

  unsub = onValue(
    ref(db, 'rooms/' + roomId),
    snap => {
      roomData = snap.val();
      if (!roomData) {
        fail('ルームがありません');
        return;
      }
      render();
    },
    fail
  );
}

/* カウントダウン表示 */
function displayCountdown(elementId, countId, startAt) {
  const remaining = startAt - serverNow();
  const box = $(elementId);
  const number = $(countId);

  if (startAt > 0 && remaining > 0) {
    box.classList.remove('hidden');
    number.classList.remove('go');
    number.textContent =
      Math.ceil(remaining / 1000);
  } else {
    box.classList.add('hidden');
  }
}

/* 画面更新 */
function render() {
  const r = roomData;
  if (!r) return;

  const players = Object.entries(r.players || {})
    .map(([id, v]) => ({ id, ...v }))
    .sort((a, b) =>
      (a.name || '').localeCompare(
        b.name || '', 'ja', { numeric: true }
      )
    );

  const current = r.currentRound;
  const responses = current
    ? (r.responses?.[current] || {})
    : {};

  const until = (r.startAt || 0) - serverNow();

  if (role === 'teacher') {

    $('roomCode').textContent = roomId;
    $('joinedCount').textContent = players.length;
    $('stoppedCount').textContent =
      Object.keys(responses).length;

    displayCountdown(
      'teacherCountdown',
      'teacherCount',
      r.startAt
    );

    $('teacherStatus').textContent =
      !r.startAt
        ? '待機中'
        : until > 0
          ? 'ふりこを準備してください'
          : 'スタート！ 計測中';

    $('startRound').disabled = !!r.startAt;

    $('results').replaceChildren();

    for (const p of players) {
      const d = responses[p.id];
      const tr = document.createElement('tr');

      const secs = d
        ? (d.stoppedAt - r.startAt) / 1000
        : null;

      const vals = [
        p.name || '（名前なし）',
        d ? '停止済み' : '待機中',
        d ? secs.toFixed(3) + ' 秒' : '—',
        d ? Math.abs(secs - 10).toFixed(3) + ' 秒' : '—'
      ];

      for (const val of vals) {
        const td = document.createElement('td');
        td.textContent = val;
        tr.append(td);
      }

      $('results').append(tr);
    }

  } else if (role === 'student') {

    const p = r.players?.[uid];
    $('studentName').textContent = p?.name || '';

    /* 新しいチャレンジで状態を初期化 */
    if (current !== roundId) {
      roundId = current;
      stopped = false;
      starting = false;
    }

    const response = responses[uid];

    if (response) {
      stopped = true;
      starting = false;
    }

    displayCountdown(
      'studentCountdown',
      'studentCount',
      r.startAt
    );

    const active =
      !!r.startAt &&
      !!current &&
      until <= 0 &&
      !stopped;

    $('stopBtn').classList.toggle(
      'hidden', !active
    );

    $('stopBtn').disabled =
      !active || starting;

    if (stopped) {
      $('studentStatus').textContent =
        '送信しました！';
      $('studentHint').textContent =
        '先生の結果発表を待ちましょう';
      $('stopMessage').textContent =
        '記録は先生の画面に届きました。';

    } else if (!r.startAt) {
      $('studentStatus').textContent =
        '先生のスタートを待っています';
      $('studentHint').textContent =
        'ふりこを準備しましょう';
      $('stopMessage').textContent = '';

    } else if (until > 0) {
      $('studentStatus').textContent =
        'もうすぐスタート！';
      $('studentHint').textContent =
        'カウントダウンを見て準備しましょう';
      $('stopMessage').textContent = '';

    } else {
      $('studentStatus').textContent =
        'スタート！';
      $('studentHint').textContent =
        '10往復したらストップ！';
      $('stopMessage').textContent = '';
    }
  }
}

/* ホーム */
$('homeBtn').onclick = () => {
  if (unsub) {
    unsub();
    unsub = null;
  }

  role = null;
  roomData = null;
  roundId = null;
  stopped = false;
  starting = false;

  show('home');
  clearError();
};

$('teacherOpen').onclick = () =>
  show('teacherSetup');

$('studentOpen').onclick = () =>
  show('studentSetup');

/* ルーム作成 */
$('createRoom').onclick = async () => {
  try {
    clearError();

    let code;

    for (let i = 0; i < 15; i++) {
      const c = randCode();

      if (!(await get(ref(db, 'rooms/' + c))).exists()) {
        code = c;
        break;
      }
    }

    if (!code) {
      throw Error('コードを作れませんでした');
    }

    roomId = code;
    role = 'teacher';

    await set(ref(db, 'rooms/' + code), {
      teacher: uid,
      createdAt: serverTimestamp(),
      startAt: 0,
      currentRound: '',
      players: {}
    });

    show('teacher');
    listenRoom();

  } catch (e) {
    fail(e);
  }
};

/* 児童参加 */
$('joinRoom').onclick = async () => {
  try {
    clearError();

    const code = $('roomInput').value.trim();
    const name = $('nameInput').value.trim();

    if (!/^\d{6}$/.test(code)) {
      throw Error('6桁の参加コードを入力してください');
    }

    if (!name) {
      throw Error('出席番号または名前を入力してください');
    }

    const snap = await get(
      ref(db, 'rooms/' + code)
    );

    if (!snap.exists()) {
      throw Error('参加コードが見つかりません');
    }

    roomId = code;
    role = 'student';

    await set(
      ref(db, `rooms/${code}/players/${uid}`),
      {
        name,
        joinedAt: serverTimestamp()
      }
    );

    roundId = null;
    stopped = false;
    starting = false;

    show('student');
    listenRoom();

  } catch (e) {
    fail(e);
  }
};

/* 全員スタート */
$('startRound').onclick = async () => {
  try {
    clearError();

    const id = push(
      ref(db, 'temporaryIds')
    ).key;

    await update(
      ref(db, 'rooms/' + roomId),
      {
        currentRound: id,
        startAt: serverNow() + 5000
      }
    );

  } catch (e) {
    fail(e);
  }
};

/* 次のチャレンジ */
$('newRound').onclick = async () => {
  try {
    clearError();

    starting = false;
    stopped = false;

    await update(
      ref(db, 'rooms/' + roomId),
      {
        currentRound: '',
        startAt: 0
      }
    );

  } catch (e) {
    fail(e);
  }
};

/* 児童ストップ */
$('stopBtn').onclick = async () => {
  if (
    stopped ||
    starting ||
    !roomData?.startAt ||
    serverNow() < roomData.startAt
  ) return;

  starting = true;
  $('stopBtn').disabled = true;

  const selectedRound = roomData.currentRound;
  const t = serverNow();

  try {
    await set(
      ref(
        db,
        `rooms/${roomId}/responses/${selectedRound}/${uid}`
      ),
      { stoppedAt: t }
    );

    stopped = true;
    starting = false;
    render();

  } catch (e) {
    starting = false;
    fail(e);
    render();
  }
};

/* CSV保存 */
$('csv').onclick = () => {
  if (!roomData) return;

  const rows = [
    ['名前', '計測秒', '10秒との差']
  ];

  const r = roomData;

  for (
    const [id, item] of
    Object.entries(
      r.responses?.[r.currentRound] || {}
    )
  ) {
    const secs =
      (item.stoppedAt - r.startAt) / 1000;

    rows.push([
      r.players?.[id]?.name || id,
      secs.toFixed(3),
      Math.abs(secs - 10).toFixed(3)
    ]);
  }

  const csv = '\ufeff' +
    rows.map(row =>
      row.map(v =>
        '"' + String(v).replaceAll('"', '""') + '"'
      ).join(',')
    ).join('\r\n');

  const a = document.createElement('a');

  a.href = URL.createObjectURL(
    new Blob([csv], {
      type: 'text/csv;charset=utf-8'
    })
  );

  a.download = 'ふりこチャレンジ.csv';
  a.click();

  setTimeout(
    () => URL.revokeObjectURL(a.href),
    1000
  );
};

/* Firebase初期化 */
try {
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getDatabase(app);

  onValue(
    ref(db, '.info/serverTimeOffset'),
    snap => {
      offset = snap.val() || 0;
    }
  );

  await signInAnonymously(auth);
  uid = auth.currentUser.uid;

  /* 100ミリ秒ごとに表示更新 */
  setInterval(() => {
    if (roomData) render();
  }, 100);

} catch (e) {
  fail(e);
}

</script>
</body>
</html>
